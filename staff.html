<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a1a1a">
<title>Masal Staff</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#c6a55c;--gold-dark:#9c7e3e;--dark:#1a1a1a;--bg:#f7f5f0;--muted:#888;--ok:#27ae60;--err:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#1a1a1a;overflow-x:hidden}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:#222;min-height:100vh;overflow-x:hidden}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.login-box{background:#fff;padding:2.5rem;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.12);max-width:360px;width:100%;text-align:center}
.login-logo{height:56px;width:auto;margin-bottom:.5rem;filter:invert(72%) sepia(40%) saturate(400%) hue-rotate(5deg) brightness(95%)}
.login-box p{color:var(--muted);font-size:.9rem;margin-bottom:1.4rem}
.login-box input{width:100%;padding:.9rem 1rem;border:1px solid #ddd;border-radius:8px;font-size:1.05rem;margin-bottom:1rem;outline:none;text-align:center;letter-spacing:3px}
.login-box input:focus{border-color:var(--gold)}
.login-box .login-btn{width:100%;padding:.9rem;background:var(--gold);color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
.login-box .login-btn:hover{background:var(--gold-dark)}
.login-box .login-btn:disabled{opacity:.6;cursor:not-allowed}
.login-error{color:var(--err);font-size:.85rem;margin-top:.6rem;min-height:1.2em}
.lang-picker{display:flex;justify-content:center;gap:.5rem;margin-bottom:1.6rem}
.lang-btn{background:#f7f5f0;border:1px solid #e0dbd0;color:#666;padding:.4rem .9rem;border-radius:20px;cursor:pointer;font-size:.82rem;font-weight:500;transition:all .15s}
.lang-btn:hover{border-color:var(--gold);color:var(--gold-dark)}
.lang-btn.active{background:var(--gold);color:#fff;border-color:var(--gold)}

/* HEADER */
header{background:var(--dark);color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.h-logo{height:34px;filter:brightness(0) invert(1)}
.h-right{display:flex;align-items:center;gap:.8rem}
.h-name{font-size:.88rem;color:#ccc}
.h-dept{font-size:.75rem;color:var(--gold);background:rgba(198,165,92,.15);padding:.2rem .55rem;border-radius:20px}
.h-logout{background:transparent;border:1px solid rgba(198,165,92,.5);color:var(--gold);padding:.35rem .8rem;border-radius:6px;cursor:pointer;font-size:.75rem;letter-spacing:.5px}
.h-logout:hover{background:var(--gold);color:#fff}

/* TABS */
.tabs{background:#fff;border-bottom:2px solid #e5e1d8;display:flex}
.tab{flex:1;text-align:center;padding:.9rem .4rem;cursor:pointer;color:var(--muted);font-size:.78rem;letter-spacing:.4px;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
.tab.active{color:var(--gold-dark);border-bottom-color:var(--gold)}
.tab:hover{color:#333}

/* SECTIONS */
.section{display:none;padding:1.2rem 1rem 2rem}
.section.active{display:block}

/* WEEK NAV */
.week-nav{display:flex;align-items:center;gap:.6rem;margin-bottom:1.2rem;flex-wrap:wrap}
.week-btn{background:#fff;border:1px solid #ddd;color:#555;padding:.4rem .8rem;border-radius:6px;cursor:pointer;font-size:.82rem}
.week-btn:hover{border-color:var(--gold);color:var(--gold-dark)}
.week-label{font-size:.88rem;font-weight:500;color:#444;background:#fff;padding:.4rem .9rem;border-radius:6px;border:1px solid #e5e1d8;white-space:nowrap}

/* MY SHIFTS */
.shift-day-card{background:#fff;border-radius:12px;padding:1rem 1.1rem;margin-bottom:.7rem;border:1px solid #e5e1d8;display:flex;align-items:center;gap:1rem}
.shift-day-card.has-shift{border-left:4px solid var(--gold)}
.shift-day-card.no-shift{opacity:.5}
.sdc-day{min-width:80px}
.sdc-dayname{font-weight:600;font-size:.92rem;color:#222}
.sdc-date{font-size:.75rem;color:var(--muted);margin-top:.1rem}
.sdc-time{font-size:1rem;font-weight:700;color:var(--gold-dark)}
.sdc-hrs{font-size:.78rem;color:var(--muted);background:#f7f5f0;padding:.15rem .5rem;border-radius:10px;margin-left:.4rem}
.sdc-empty{color:#ccc;font-size:.85rem}

/* SCHEDULE TABLE */
.sched-wrap{overflow-x:auto;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.05);background:#fff}
.sched-table{width:100%;border-collapse:collapse;min-width:560px}
.sched-th{background:#fafafa;text-align:center;padding:.55rem .35rem;font-size:.65rem;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);border-bottom:2px solid #eee;border-right:1px solid #eee;white-space:nowrap;min-width:82px}
.sched-th.staff-th{text-align:left;min-width:120px;padding-left:.8rem;border-right:2px solid #e0dbd0}
.sched-th.wknd{background:#fff9ef}
.sched-tr:hover .sched-td{background:#fcfbf7}
.sched-td{padding:0;border-bottom:1px solid #f0ece4;border-right:1px solid #f0ece4}
.sched-td.staff-td{padding:.4rem .8rem;background:#fafafa;border-right:2px solid #e0dbd0;font-size:.82rem;font-weight:500;vertical-align:middle;white-space:nowrap}
.sched-td.wknd{background:#fffcf5}
.sched-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;padding:.3rem .2rem;text-align:center;gap:1px}
.sv-time{font-size:.78rem;font-weight:600;color:#222}
.sv-hrs{font-size:.63rem;color:var(--muted)}
.sched-cell.empty{color:#ddd;font-size:.9rem}
.staff-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.staff-dept{display:block;font-size:.67rem;color:#bbb;margin-top:.1rem}
.me-row .sched-td.staff-td{background:#fffbf3;border-left:3px solid var(--gold)}
.me-row .sched-td{background:#fffdf8}

/* AVAILABILITY */
.avail-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media(min-width:500px){.avail-grid{grid-template-columns:repeat(4,1fr)}}
.avail-day{background:#fff;border-radius:10px;border:2px solid #e5e1d8;padding:.8rem .6rem;cursor:pointer;text-align:center;transition:all .2s;user-select:none}
.avail-day.avail{border-color:var(--ok);background:#f0faf5}
.avail-day.notavail{border-color:var(--err);background:#fdf0f0}
.avail-day.partial{border-color:#e67e22;background:#fff8f0}
.avail-dayname{font-weight:600;font-size:.88rem}
.avail-date{font-size:.72rem;color:var(--muted);margin-top:.1rem}
.avail-status{font-size:.72rem;margin-top:.5rem;font-weight:600;letter-spacing:.3px}
.avail-day.avail .avail-status{color:var(--ok)}
.avail-day.notavail .avail-status{color:var(--err)}
.avail-day.partial .avail-status{color:#e67e22}
.avail-times{font-size:.65rem;color:#e67e22;margin-top:.3rem;line-height:1.4;word-break:break-all}
.avail-save{background:var(--gold);color:#fff;border:none;padding:.7rem 1.6rem;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:1rem;width:100%}
.avail-save:hover{background:var(--gold-dark)}
.avail-save:disabled{opacity:.6;cursor:not-allowed}
/* avail day modal */
.avail-radio-group{display:flex;flex-direction:column;gap:.5rem;margin-top:.8rem}
.avail-radio{display:block;cursor:pointer}
.avail-radio input[type=radio]{display:none}
.avail-radio-box{display:flex;align-items:center;gap:.75rem;padding:.85rem 1rem;border-radius:10px;border:2px solid #e5e1d8;transition:all .15s;font-size:.9rem;font-weight:500}
.avail-radio input:checked + .avail-radio-box{border-width:2px}
.avail-radio-green{background:#f0faf5}.avail-radio input:checked + .avail-radio-green{border-color:var(--ok);background:#e2f5ea}
.avail-radio-red{background:#fdf0f0}.avail-radio input:checked + .avail-radio-red{border-color:var(--err);background:#fde4e4}
.avail-radio-amber{background:#fff8f0}.avail-radio input:checked + .avail-radio-amber{border-color:#e67e22;background:#fdeede}
.avail-radio-icon{font-size:1.1rem;width:1.4rem;text-align:center}
.avail-ranges-wrap{margin-top:1rem;padding-top:1rem;border-top:1px solid #f0ece4}
.avail-range-row{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:.5rem;margin-bottom:.5rem}
.avail-range-row .input{padding:.5rem .6rem;font-size:.88rem}
.avail-range-del{background:none;border:1px solid #f5c6cb;color:#c0392b;border-radius:6px;padding:.4rem .6rem;cursor:pointer;font-size:.9rem;line-height:1}
.avail-range-del:hover{background:#fdf0f0}
.avail-add-range{background:none;border:1px dashed var(--gold);color:var(--gold-dark);border-radius:8px;padding:.55rem 1rem;font-size:.82rem;cursor:pointer;width:100%;margin-top:.3rem;font-weight:500}
.avail-add-range:hover{background:#fdf8f0}

/* NOTIFICATIONS */
.notif-card{background:#fff;border-radius:12px;border:1px solid #e5e1d8;padding:1rem 1.1rem;margin-bottom:.8rem}
.notif-card.action-needed{border-left:4px solid var(--gold)}
.notif-card.accepted{border-left:4px solid var(--ok)}
.notif-card.rejected{border-left:4px solid var(--err);opacity:.65}
.nc-who{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap}
.nc-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.73rem;padding:.25rem .65rem;border-radius:20px;font-weight:600;white-space:nowrap}
.nc-badge.waiting{background:#fff4d6;color:#9c7e3e}
.nc-badge.accepted{background:#d4edda;color:#155724}
.nc-badge.rejected{background:#f8d7da;color:#721c24}
.nc-badge.action{background:#fef3e2;color:#e67e22;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.nc-shifts{font-size:.82rem;color:#555;margin-bottom:.7rem;line-height:1.6}
.nc-actions{display:flex;gap:.5rem}
.nc-btn{flex:1;padding:.5rem;border-radius:7px;border:none;font-size:.82rem;font-weight:600;cursor:pointer}
.nc-btn.accept{background:var(--ok);color:#fff}
.nc-btn.reject{background:#f8d7da;color:#721c24}

/* SWAP FAB */
.swap-fab{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--gold);color:#fff;border:none;border-radius:30px;padding:.9rem 1.6rem;font-size:.92rem;font-weight:600;letter-spacing:.3px;cursor:pointer;box-shadow:0 6px 22px rgba(198,165,92,.5);z-index:40;display:none;gap:.5rem;transition:transform .2s,background .2s}
.swap-fab.visible{display:inline-flex;align-items:center;justify-content:center}
.swap-fab:hover{background:var(--gold-dark);transform:translateY(-2px)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-bg.open{display:flex}
@media(min-width:500px){.modal-bg{align-items:center;padding:1rem}}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:1.5rem;max-height:92vh;overflow-y:auto}
@media(min-width:500px){.modal{border-radius:16px}}
.modal-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 1.2rem}
.modal h3{font-family:Georgia,serif;font-size:1.15rem;margin-bottom:.3rem}
.modal p.sub{color:var(--muted);font-size:.84rem;margin-bottom:1rem}
.modal label{display:block;font-size:.72rem;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:.8rem 0 .3rem}
.modal select{width:100%;padding:.6rem .8rem;border:1px solid #ddd;border-radius:7px;font-size:.9rem;outline:none;background:#fff}
.modal select:focus{border-color:var(--gold)}
.modal-actions{display:flex;gap:.6rem;margin-top:1.2rem}
.modal-actions button{flex:1;padding:.65rem;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;border:none}
.modal-actions .primary{background:var(--gold);color:#fff}
.modal-actions .primary:hover{background:var(--gold-dark)}
.modal-actions .primary:disabled{opacity:.6;cursor:not-allowed}
.modal-actions .secondary{background:#f0ece4;color:#555}

.spinner{color:var(--muted);font-size:.9rem;padding:3rem;text-align:center}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-state .icon{font-size:2.5rem;margin-bottom:.8rem}
/* GUIDE CARD */
.guide-card{background:linear-gradient(135deg,#1a1a1a 0%,#2a2218 100%);border-radius:14px;padding:1.2rem 1.2rem 1rem;margin-bottom:1.2rem;position:relative}
.guide-card-title{color:var(--gold);font-size:1rem;font-weight:700;margin-bottom:.8rem}
.guide-card-items{list-style:none;display:flex;flex-direction:column;gap:.45rem;margin-bottom:.9rem}
.guide-card-items li{color:#ccc;font-size:.82rem;line-height:1.4}
.guide-card-items li b{color:#fff}
.guide-close{background:var(--gold);color:#fff;border:none;border-radius:7px;padding:.4rem 1rem;font-size:.78rem;font-weight:600;cursor:pointer;letter-spacing:.5px}
.guide-close:hover{background:var(--gold-dark)}
/* SETTINGS */
.settings-card{background:#fff;border-radius:12px;border:1px solid #e5e1d8;padding:1.2rem 1.3rem;margin-bottom:1rem}
.settings-card h4{font-size:.95rem;font-weight:700;color:#222;margin-bottom:.35rem}
.settings-card p{font-size:.82rem;color:var(--muted);margin-bottom:1rem;line-height:1.5}
.email-lang-grid{display:flex;gap:.6rem;flex-wrap:wrap}
.email-lang-btn{flex:1;min-width:90px;padding:.7rem .5rem;border-radius:10px;border:2px solid #e5e1d8;background:#fff;font-size:.9rem;font-weight:600;cursor:pointer;text-align:center;transition:all .18s;line-height:1.4;color:#111}
.email-lang-btn:hover{border-color:var(--gold);background:#fdf8f0;color:#111}
.email-lang-btn.active{border-color:var(--gold);background:linear-gradient(135deg,#fffbf0,#fdf3d8);color:#111}
.email-lang-btn .el-flag{font-size:1.4rem;display:block;margin-bottom:.2rem}
.email-lang-btn .el-saved{font-size:.7rem;color:var(--ok);display:block;margin-top:.2rem;font-weight:500}
.settings-save-msg{font-size:.82rem;color:var(--ok);margin-top:.7rem;min-height:1.2em;font-weight:500}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:.6rem 1.2rem;border-radius:8px;font-size:.85rem;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 2rem);text-align:center}
.toast.show{opacity:1}

/* ── MOBILE ──────────────────────────────────────────── */
@media(max-width:480px){
  /* Prevent iOS auto-zoom on input focus */
  input,select,textarea{font-size:16px!important}

  /* Header compact */
  header{padding:.75rem 1rem}
  .h-logo{height:28px}
  .h-name{font-size:.82rem}
  .h-dept{font-size:.7rem;padding:.15rem .45rem}
  .h-logout{padding:.3rem .65rem;font-size:.72rem;min-height:34px}

  /* Tabs — fit all 5 on one line */
  .tabs{padding:0}
  .tab{padding:.75rem .15rem;font-size:.62rem;letter-spacing:0}

  /* Sections */
  .section{padding:.9rem .85rem 2rem}

  /* Week nav */
  .week-nav{gap:.4rem;margin-bottom:.9rem}
  .week-btn{padding:.45rem .75rem;font-size:.8rem;min-height:38px}
  .week-label{font-size:.8rem;padding:.35rem .7rem}

  /* Shift day cards */
  .shift-day-card{padding:.85rem .9rem;gap:.75rem}
  .sdc-dayname{font-size:.88rem}
  .sdc-time{font-size:.95rem}

  /* Availability grid — 2 columns always */
  .avail-grid{grid-template-columns:1fr 1fr;gap:.5rem}
  .avail-day{padding:.7rem .5rem}
  .avail-dayname{font-size:.84rem}

  /* Availability range row — stack on mobile */
  .avail-range-row{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:.4rem}
  .avail-range-row .input{padding:.55rem .5rem}
  .avail-range-del{grid-column:span 2;width:100%;border-radius:6px;padding:.5rem}

  /* Save button */
  .avail-save{padding:.75rem;font-size:.9rem;min-height:46px}

  /* Notification cards */
  .notif-card{padding:.85rem .9rem}
  .nc-actions{gap:.4rem}
  .nc-btn{min-height:40px;font-size:.85rem}

  /* Modal full-sheet on mobile (already bottom-sheet) */
  .modal{padding:1.4rem 1.1rem 2rem}
  .modal h3{font-size:1.1rem}
  .modal-actions button{min-height:44px;font-size:.9rem}

  /* Swap FAB */
  .swap-fab{bottom:1.2rem;right:1.2rem;padding:.8rem 1.3rem;font-size:.88rem}

  /* Guide card */
  .guide-card{padding:1rem}
  .guide-card-items li{font-size:.8rem}

  /* Schedule table scrollable */
  .sched-wrap{border-radius:8px}
  .sched-table{min-width:480px}
  .sched-th{min-width:70px;padding:.45rem .25rem;font-size:.6rem}
  .sched-th.staff-th{min-width:100px;padding-left:.6rem}
  .sched-cell{min-height:40px}
  .sv-time{font-size:.72rem}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap" class="login-wrap">
  <div class="login-box">
    <img class="login-logo" src="https://i0.wp.com/masalrestaurant.nl/wp-content/uploads/2021/11/Masal_Logo_DEF.png?fit=600%2C304&ssl=1" alt="Masal">
    <div class="lang-picker">
      <button class="lang-btn" onclick="setLang('nl')" id="lbNL">🇳🇱 NL</button>
      <button class="lang-btn" onclick="setLang('en')" id="lbEN">🇬🇧 EN</button>
      <button class="lang-btn active" onclick="setLang('tr')" id="lbTR">🇹🇷 TR</button>
    </div>
    <p id="loginSubtitle">Şifrenizi girerek devam edin</p>
    <form onsubmit="login(event)">
      <input type="password" id="loginPw" placeholder="••••••••" autocomplete="current-password" required>
      <button type="submit" class="login-btn" id="loginBtn">Giriş Yap</button>
      <div class="login-error" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header>
    <img class="h-logo" src="https://i0.wp.com/masalrestaurant.nl/wp-content/uploads/2021/11/Masal_Logo_DEF.png?fit=600%2C304&ssl=1" alt="Masal">
    <div class="h-right">
      <span class="h-dept" id="hDept"></span>
      <span class="h-name" id="hName"></span>
      <button class="h-logout" onclick="logout()" id="hLogout">Çıkış</button>
    </div>
  </header>

  <nav class="tabs">
    <div class="tab active" data-tab="shifts" onclick="switchTab('shifts')" id="tabShifts">Vardiyam</div>
    <div class="tab" data-tab="table" onclick="switchTab('table')" id="tabTable">Tablo</div>
    <div class="tab" data-tab="avail" onclick="switchTab('avail')" id="tabAvail">Müsaitlik</div>
    <div class="tab" data-tab="notif" onclick="switchTab('notif')" id="tabNotif">Vardiya Değişimi</div>
    <div class="tab" data-tab="settings" onclick="switchTab('settings')" id="tabSettings">Ayarlar</div>
  </nav>

  <section class="section active" id="sec-shifts">
    <div id="guideCard" class="guide-card" style="display:none">
      <div class="guide-card-title" id="guideTitle"></div>
      <ul class="guide-card-items" id="guideItems"></ul>
      <button class="guide-close" onclick="dismissGuide()" id="guideDismiss"></button>
    </div>
    <div class="week-nav">
      <button class="week-btn" onclick="changeWeek(-1)" id="btnPrevShifts">← Önceki</button>
      <span class="week-label" id="weekLabel">—</span>
      <button class="week-btn" onclick="changeWeek(1)" id="btnNextShifts">Sonraki →</button>
    </div>
    <div id="shiftsContent"><div class="spinner">…</div></div>
  </section>

  <section class="section" id="sec-table">
    <div class="week-nav">
      <button class="week-btn" onclick="changeWeekTable(-1)" id="btnPrevTable">← Önceki</button>
      <span class="week-label" id="weekLabelTable">—</span>
      <button class="week-btn" onclick="changeWeekTable(1)" id="btnNextTable">Sonraki →</button>
    </div>
    <div class="sched-wrap">
      <table class="sched-table" id="schedTable"><tbody><tr><td class="spinner">…</td></tr></tbody></table>
    </div>
  </section>

  <section class="section" id="sec-avail">
    <div class="week-nav">
      <button class="week-btn" onclick="changeWeekAvail(-1)" id="btnPrevAvail">← Önceki</button>
      <span class="week-label" id="weekLabelAvail">—</span>
      <button class="week-btn" onclick="changeWeekAvail(1)" id="btnNextAvail">Sonraki →</button>
    </div>
    <div class="avail-grid" id="availGrid"></div>
    <button class="avail-save" id="availSaveBtn" onclick="saveAvail()">Kaydet</button>
  </section>

  <section class="section" id="sec-notif">
    <div id="notifContent"><div class="spinner">…</div></div>
  </section>

  <section class="section" id="sec-settings">
    <div class="settings-card">
      <h4 id="settingsEmailTitle"></h4>
      <p id="settingsEmailDesc"></p>
      <div class="email-lang-grid">
        <button class="email-lang-btn" id="elBtnNL" onclick="setEmailLang('nl')">
          <span class="el-flag">🇳🇱</span><span class="el-name"></span>
        </button>
        <button class="email-lang-btn" id="elBtnEN" onclick="setEmailLang('en')">

// ─── HELPERS ───────────────────────────────────────────────────
function mondayOf(d){const r=new Date(d);const day=r.getDay();r.setDate(r.getDate()-(day===0?6:day-1));r.setHours(0,0,0,0);return r}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function fmtDate(d){const p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function hrsNum(s,e){const[sh,sm]=s.split(':').map(Number);const[eh,em]=e.split(':').map(Number);return Math.round(((eh*60+em)-(sh*60+sm))/60*10)/10}
function hrsLabel(h){return h+L().hrs}
function weekLabel(monday){const fri=addDays(monday,6);const M=L().months;return`${monday.getDate()} ${M[monday.getMonth()]} – ${fri.getDate()} ${M[fri.getMonth()]} ${fri.getFullYear()}`}
function hexTint(hex,a){if(!hex||!hex.startsWith('#'))return '';const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmtTimeInput(el){let v=el.value.replace(/[^0-9]/g,'');if(v.length>=3)v=v.slice(0,2)+':'+v.slice(2,4);el.value=v}

// ─── AUTH ──────────────────────────────────────────────────────
let me=null;
let allProfiles=[];

async function login(e){
  e.preventDefault();
  const pw=document.getElementById('loginPw').value.trim();
  const btn=document.getElementById('loginBtn');
  btn.disabled=true; btn.textContent=L().loginLoad;
  document.getElementById('loginErr').textContent='';
  const{data:profiles,error}=await sb.from('profiles').select('*');
  if(error||!profiles?.length){document.getElementById('loginErr').textContent=L().connErr;btn.disabled=false;btn.textContent=L().loginBtn;return}
  const match=profiles.find(p=>p.password===pw);
  if(!match){document.getElementById('loginErr').textContent=L().loginErr;btn.disabled=false;btn.textContent=L().loginBtn;return}
  sessionStorage.setItem('masalStaffId',match.id);
  allProfiles=profiles;
  showApp(match);
}

function logout(){sessionStorage.removeItem('masalStaffId');location.reload()}

async function initApp(){
  setLang(lang); // apply lang on load
  const id=sessionStorage.getItem('masalStaffId');
  if(!id)return;
  const{data:profiles}=await sb.from('profiles').select('*');
  if(!profiles)return;
  allProfiles=profiles;
  const match=profiles.find(p=>p.id===id);
  if(match)showApp(match);
}

// ─── VARDIYAM ─────────────────────────────────────────────────
let currentWeek=null;
function changeWeek(dir){currentWeek=addDays(currentWeek,dir*7);loadShifts()}

async function loadShifts(){
  document.getElementById('weekLabel').textContent=weekLabel(currentWeek);
  const ws=fmtDate(currentWeek);
  // Sadece "Haber Ver" ile bildirimi gönderilmiş vardiyalar görünür
  const[{data:shifts},{data:notifs=[]}]=await Promise.all([
    sb.from('shifts').select('*,shift_assignments(staff_id)').eq('week_start',ws),
    sb.from('shift_notifications').select('shift_id').eq('week_start',ws).eq('staff_id',me.id)
  ]);
  const notified=new Set((notifs||[]).map(n=>n.shift_id));
  const myShifts={};
  (shifts||[]).filter(s=>notified.has(s.id)).forEach(s=>{if(s.shift_assignments?.some(a=>a.staff_id===me.id))myShifts[s.day_index]={start:s.start_time,end:s.end_time}});
  const D=L().days; const M=L().months;
  let html=''; let total=0;
  for(let i=0;i<7;i++){
    const dt=addDays(currentWeek,i); const sh=myShifts[i];
    if(sh){const h=hrsNum(sh.start,sh.end);total+=h;
      html+=`<div class="shift-day-card has-shift"><div class="sdc-day"><div class="sdc-dayname">${D[i]}</div><div class="sdc-date">${dt.getDate()} ${M[dt.getMonth()]}</div></div><div><span class="sdc-time">${sh.start.slice(0,5)} – ${sh.end.slice(0,5)}</span><span class="sdc-hrs">${hrsLabel(h)}</span></div></div>`;
    }else{
      html+=`<div class="shift-day-card no-shift"><div class="sdc-day"><div class="sdc-dayname">${D[i]}</div><div class="sdc-date">${dt.getDate()} ${M[dt.getMonth()]}</div></div><div class="sdc-empty">${L().noShift}</div></div>`;
    }
  }
  if(total>0)html+=`<div style="text-align:right;color:var(--gold-dark);font-size:.85rem;font-weight:600;margin-top:.3rem">${L().weekTotal}: ${hrsLabel(total)}</div>`;
  document.getElementById('shiftsContent').innerHTML=html||`<div class="empty-state"><div class="icon">📭</div>${L().noShift}</div>`;
}

// ─── TABLO ────────────────────────────────────────────────────
let tableWeek=null;
function changeWeekTable(dir){tableWeek=addDays(tableWeek,dir*7);loadTable()}

async function loadTable(){
  document.getElementById('weekLabelTable').textContent=weekLabel(tableWeek);
  const ws=fmtDate(tableWeek);
  // Sadece "Haber Ver"ile yayınlanan vardiyalar görünür (shift_notifications kayıtlı olanlar)
  const[{data:shifts=[]},{data:notifs=[]}]=await Promise.all([
    sb.from('shifts').select('*').eq('week_start',ws),
    sb.from('shift_notifications').select('shift_id,staff_id').eq('week_start',ws)
  ]);
  const notifSet=new Set((notifs||[]).map(n=>`${n.shift_id}_${n.staff_id}`));
  const ids=(shifts||[]).map(s=>s.id);
  let assigns=[];
  if(ids.length){const{data}=await sb.from('shift_assignments').select('*').in('shift_id',ids);assigns=(data||[]).filter(a=>notifSet.has(`${a.shift_id}_${a.staff_id}`))}
  const matrix={};
  const staff=allProfiles.filter(p=>p.role!=='admin');
  staff.forEach(p=>{matrix[p.id]={}});
  shifts.forEach(s=>{assigns.filter(a=>a.shift_id===s.id).forEach(a=>{if(matrix[a.staff_id]&&!matrix[a.staff_id][s.day_index])matrix[a.staff_id][s.day_index]={start:s.start_time,end:s.end_time}})});
  const DS=L().daysShort; const M=L().months;
  const thDays=DS.map((d,i)=>{const dt=addDays(tableWeek,i);return`<th class="sched-th${i>=5?' wknd':''}">${d}<br><small style="font-weight:400;font-size:.6rem">${dt.getDate()} ${M[dt.getMonth()]}</small></th>`}).join('');
  const rows=staff.length?staff.map(p=>{
    const isMe=p.id===me.id;
    const tint=isMe?hexTint(p.color,0.18):'';
    const cells=DS.map((_,i)=>{const cell=matrix[p.id]?.[i];const bg=tint?`style="background:${tint}"`:''
      if(cell){const h=hrsNum(cell.start,cell.end);return`<td class="sched-td${i>=5?' wknd':''}" ${bg}><div class="sched-cell"><span class="sv-time">${cell.start.slice(0,5)}–${cell.end.slice(0,5)}</span><span class="sv-hrs">${hrsLabel(h)}</span></div></td>`}
      return`<td class="sched-td${i>=5?' wknd':''}" ${bg}><div class="sched-cell empty">·</div></td>`}).join('');
    const dept=p.department?`<span class="staff-dept">${esc(p.department)}</span>`:'';
    return`<tr class="sched-tr${isMe?' me-row':''}"><td class="sched-td staff-td"><span class="staff-dot" style="background:${p.color||'#aaa'}"></span> ${esc(p.name||'?')}${dept}</td>${cells}</tr>`;
  }).join(''):`<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--muted)">—</td></tr>`;
  document.getElementById('schedTable').innerHTML=`<thead><tr><th class="sched-th staff-th">${L().tabTable}</th>${thDays}</tr></thead><tbody>${rows}</tbody>`;
}

// ─── MÜSAİTLİK ───────────────────────────────────────────────
let availWeek=null; let availState={};
let availEditDay=null; let availRanges=[];
function changeWeekAvail(dir){availWeek=addDays(availWeek,dir*7);loadAvail()}

async function loadAvail(){
  document.getElementById('weekLabelAvail').textContent=weekLabel(availWeek);
  const ws=fmtDate(availWeek);
  const{data}=await sb.from('availability').select('day_index,status,unavailable_ranges').eq('staff_id',me.id).eq('week_start',ws);
  // Default: all days available
  availState={};
  for(let i=0;i<7;i++) availState[i]={status:'available',ranges:[]};
  // Override with saved data
  (data||[]).forEach(r=>{
    if(r.status) availState[r.day_index]={status:r.status,ranges:r.unavailable_ranges||[]};
  });
  renderAvail();
}

function renderAvail(){
  const D=L().days; const M=L().months;
  let html='';
  for(let i=0;i<7;i++){
    const dt=addDays(availWeek,i);
    const s=availState[i];
    let cls='',lbl='',timesHtml='';
    if(s?.status==='available'){cls='avail';lbl=L().availAvail;}
    else if(s?.status==='unavailable'){cls='notavail';lbl=L().availNot;}
    else if(s?.status==='partial'){
      cls='partial';lbl=L().availPartial;
      if(s.ranges?.length) timesHtml=`<div class="avail-times">${s.ranges.map(r=>`${r.from}–${r.to}`).join('<br>')}</div>`;
    } else {lbl=L().availNone;}
    html+=`<div class="avail-day ${cls}" onclick="openDayModal(${i})" data-day="${i}">
      <div class="avail-dayname">${D[i]}</div>
      <div class="avail-date">${dt.getDate()} ${M[dt.getMonth()]}</div>
      <div class="avail-status">${lbl}</div>
      ${timesHtml}
    </div>`;
  }
  document.getElementById('availGrid').innerHTML=html;
  document.getElementById('availSaveBtn').textContent=L().availSave;
}

function openDayModal(idx){
  availEditDay=idx;
  const D=L().days; const M=L().months;
  const dt=addDays(availWeek,idx);
  document.getElementById('availDayTitle').textContent=`${D[idx]}, ${dt.getDate()} ${M[dt.getMonth()]}`;
  document.getElementById('availLblAvail').textContent=L().availFullAvail;
  document.getElementById('availLblNot').textContent=L().availFullNot;
  document.getElementById('availLblPartial').textContent=L().availPartialLbl;
  document.getElementById('availRangesTitle').textContent=L().availRangesTitle;
  document.getElementById('availAddRangeBtn').textContent=L().availAddRange;
  document.getElementById('availCancelBtn').textContent=L().swapCancel;
  const s=availState[idx];
  const status=s?.status||'available';
  document.querySelector(`input[name="availStatus"][value="${status}"]`).checked=true;
  availRanges=s?.ranges?JSON.parse(JSON.stringify(s.ranges)):[];
  if(!availRanges.length&&status==='partial') availRanges=[{from:'09:00',to:'17:00'}];
  renderAvailRanges();
  document.getElementById('availRangesWrap').style.display=status==='partial'?'block':'none';
  document.getElementById('availDayModal').classList.add('open');
}

function closeAvailModal(){
  document.getElementById('availDayModal').classList.remove('open');
  availEditDay=null;
}

function onAvailStatusChange(){
  const status=document.querySelector('input[name="availStatus"]:checked')?.value;
  document.getElementById('availRangesWrap').style.display=status==='partial'?'block':'none';
  if(status==='partial'&&!availRanges.length){availRanges=[{from:'09:00',to:'17:00'}];renderAvailRanges();}
}

function addAvailRange(){
  availRanges.push({from:'09:00',to:'17:00'});
  renderAvailRanges();
}

function removeAvailRange(i){
  availRanges.splice(i,1);
  renderAvailRanges();
}

function renderAvailRanges(){
  document.getElementById('availRangesList').innerHTML=availRanges.map((r,i)=>`
    <div class="avail-range-row">
      <input type="text" value="${r.from}" oninput="fmtTimeInput(this);availRanges[${i}].from=this.value" class="input" placeholder="09:00" maxlength="5" style="text-align:center;letter-spacing:1px">
      <span style="color:#aaa;text-align:center">–</span>
      <input type="text" value="${r.to}" oninput="fmtTimeInput(this);availRanges[${i}].to=this.value" class="input" placeholder="17:00" maxlength="5" style="text-align:center;letter-spacing:1px">
      <button class="avail-range-del" onclick="removeAvailRange(${i})">×</button>
    </div>`).join('');
}

function saveDayAvail(){
  const status=document.querySelector('input[name="availStatus"]:checked')?.value;
  if(!status) return;
  if(status==='partial'&&!availRanges.length){
    availState[availEditDay]={status:'available',ranges:[]};
  } else {
    availState[availEditDay]={status,ranges:status==='partial'?[...availRanges]:[]};
  }
  closeAvailModal();
  renderAvail();
}

async function saveAvail(){
  const btn=document.getElementById('availSaveBtn');btn.disabled=true;btn.textContent='…';
  const ws=fmtDate(availWeek);
  const{error:delErr}=await sb.from('availability').delete().eq('staff_id',me.id).eq('week_start',ws);
  if(delErr){btn.disabled=false;btn.textContent=L().availSave;showToast('⚠ '+delErr.message);return}
  const rows=Object.entries(availState).filter(([,v])=>v?.status).map(([i,v])=>({
    staff_id:me.id,week_start:ws,day_index:parseInt(i),
    type:v.status==='partial'?'partial':'allday',
    status:v.status,
    unavailable_ranges:v.ranges||[]
  }));
  if(rows.length){
    const{error:insErr}=await sb.from('availability').insert(rows);
    if(insErr){btn.disabled=false;btn.textContent=L().availSave;showToast('⚠ '+insErr.message);return}
  }
  btn.disabled=false;btn.textContent=L().availSave;
  showToast(L().availSaved);
}

// ─── BİLDİRİMLER ─────────────────────────────────────────────
async function updateNotifBadge(){
  const{data}=await sb.from('swap_requests').select('id,status,target_id').or(`requester_id.eq.${me.id},target_id.eq.${me.id}`);
  const count=(data||[]).filter(r=>r.status==='pending'&&r.target_id===me.id).length;
  updateNotifTab(count);
}

async function loadNotif(){
  document.getElementById('notifContent').innerHTML=`<div class="spinner">${L().loginLoad}</div>`;
  const{data:reqs}=await sb.from('swap_requests')
    .select('*, rs:requester_shift_id(start_time,end_time,day_index), ts:target_shift_id(start_time,end_time,day_index)')
    .or(`requester_id.eq.${me.id},target_id.eq.${me.id}`)
    .order('created_at',{ascending:false});

  const pById={};allProfiles.forEach(p=>{pById[p.id]=p});

  // Deduplicate by id (safety net)
  const seen=new Set(); const unique=(reqs||[]).filter(r=>{if(seen.has(r.id))return false;seen.add(r.id);return true});

  if(!unique.length){document.getElementById('notifContent').innerHTML=`<div class="empty-state"><div class="icon">🔔</div>${L().notifEmpty}</div>`;return}

  const D=L().days;
  let html='';
  unique.forEach(r=>{
    const isRequester=r.requester_id===me.id;
    const requester=pById[r.requester_id]||{name:'?',color:'#aaa'};
    const target=pById[r.target_id]||{name:'?',color:'#aaa'};
    const rs=r.rs,ts=r.ts;
    const rsLabel=rs?`${D[rs.day_index]} ${rs.start_time?.slice(0,5)}–${rs.end_time?.slice(0,5)}`:'?';
    const tsLabel=ts?`${D[ts.day_index]} ${ts.start_time?.slice(0,5)}–${ts.end_time?.slice(0,5)}`:'?';

    // Smart status label based on who is waiting
    let badgeCls,badgeText,cardCls='';
    if(r.status==='pending'){
      if(!isRequester){
        badgeCls='action';badgeText=L().swapActionNeeded;cardCls='action-needed';
      }else{
        badgeCls='waiting';badgeText=L().swapWaiting(target.name);
      }
    }else if(r.status==='staff_approved'){
      badgeCls='waiting';badgeText=L().swapAdminWaiting;
    }else if(r.status==='accepted'){
      badgeCls='accepted';badgeText=L().swapAccepted;cardCls='accepted';
    }else{
      badgeCls='rejected';badgeText=r.status==='admin_rejected'?L().swapAdminRejected:L().swapRejected;cardCls='rejected';
    }

    const canRespond=!isRequester&&r.status==='pending';
    const canDelete=isRequester&&(r.status==='pending'||r.status==='rejected'||r.status==='admin_rejected');

    const actionBtns=canRespond?`<div class="nc-actions">
      <button class="nc-btn reject" onclick="respondSwap('${r.id}',false)">${L().swapRejectBtn}</button>
      <button class="nc-btn accept" onclick="respondSwap('${r.id}',true)">${L().swapAcceptBtn}</button>
    </div>`:'';

    const deleteBtn=canDelete?`<div style="margin-top:.6rem;text-align:right">
      <button onclick="deleteSwap('${r.id}')" style="background:none;border:none;color:#ccc;cursor:pointer;font-size:.78rem;padding:.2rem .4rem;border-radius:4px" onmouseover="this.style.color='#c0392b'" onmouseout="this.style.color='#ccc'">✕ ${L().deleteSwap}</button>
    </div>`:'';

    html+=`<div class="notif-card ${cardCls}">
      <div class="nc-who">
        <span style="font-size:.72rem;color:var(--muted)">${isRequester?L().swapSent:L().swapReceived}:</span>
        <strong style="color:${requester.color}">${esc(requester.name)}</strong>
        <span style="color:#bbb">⇄</span>
        <strong style="color:${target.color}">${esc(target.name)}</strong>
        <span class="nc-badge ${badgeCls}">${badgeText}</span>
      </div>
      <div class="nc-shifts">
        <span style="color:${requester.color}">●</span> ${esc(requester.name)}: ${esc(rsLabel)}<br>
        <span style="color:${target.color}">●</span> ${esc(target.name)}: ${esc(tsLabel)}
      </div>
      ${actionBtns}${deleteBtn}
    </div>`;
  });
  document.getElementById('notifContent').innerHTML=html;
}

async function respondSwap(id,approve){
  if(!confirm(approve?L().swapConfirmAccept:L().swapConfirmReject))return;
  await sb.from('swap_requests').update({status:approve?'staff_approved':'rejected'}).eq('id',id);
  if(approve){
    const{data:req}=await sb.from('swap_requests').select('*,rs:requester_shift_id(start_time,end_time,day_index),ts:target_shift_id(start_time,end_time,day_index)').eq('id',id).single();
    if(req){
      const pById={};allProfiles.forEach(p=>{pById[p.id]=p});
      const rp=pById[req.requester_id],tp=pById[req.target_id];
      const D=L().days;
      await sendEmail({to:'admin',subject:`Vardiya değişim talebi: ${rp?.name} ⇄ ${tp?.name}`,
        body:`${rp?.name} ve ${tp?.name} vardiya değiştirmek istiyor.\n\n${rp?.name}: ${D[req.rs?.day_index]} ${req.rs?.start_time?.slice(0,5)}–${req.rs?.end_time?.slice(0,5)}\n${tp?.name}: ${D[req.ts?.day_index]} ${req.ts?.start_time?.slice(0,5)}–${req.ts?.end_time?.slice(0,5)}\n\nAdmin paneli: masalrestaurant.vercel.app/admin.html`});
    }
  }
  showToast(approve?L().acceptedToast:L().rejectedToast);
  loadNotif();updateNotifBadge();
}

async function deleteSwap(id){
  if(!confirm(L().confirmDelete))return;
  await sb.from('swap_requests').delete().eq('id',id);
  showToast(L().deletedToast);
  loadNotif();updateNotifBadge();
}

// ─── SWAP OLUŞTUR ─────────────────────────────────────────────
let swapShiftsCache=[];
let swapSubmitting=false;

async function openSwapModal(){
  const ws=fmtDate(currentWeek);
  // Sadece bildirimi gönderilen vardiyalar swap için seçilebilir
  const[{data:shifts},{data:notifs=[]}]=await Promise.all([
    sb.from('shifts').select('*,shift_assignments(staff_id)').eq('week_start',ws),
    sb.from('shift_notifications').select('shift_id,staff_id').eq('week_start',ws)
  ]);
  const notifSet=new Set((notifs||[]).map(n=>`${n.shift_id}_${n.staff_id}`));
  swapShiftsCache=(shifts||[]).filter(s=>(s.shift_assignments||[]).some(a=>notifSet.has(`${s.id}_${a.staff_id}`)));
  const D=L().days;
  const myShifts=swapShiftsCache.filter(s=>s.shift_assignments?.some(a=>a.staff_id===me.id&&notifSet.has(`${s.id}_${me.id}`)));
  document.getElementById('swapMyShift').innerHTML=myShifts.length
    ?myShifts.map(s=>`<option value="${s.id}">${D[s.day_index]}: ${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)}</option>`).join('')
    :`<option value="">${L().swapNoShifts}</option>`;
  document.getElementById('swapTargetStaff').innerHTML=allProfiles.filter(p=>p.id!==me.id&&p.role!=='admin').map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  document.getElementById('swapSendBtn').textContent=L().swapSend;
  swapSubmitting=false;
  loadTargetShifts();
  document.getElementById('swapModal').classList.add('open');
}

function loadTargetShifts(){
  const tid=document.getElementById('swapTargetStaff').value;
  const D=L().days;
  const ts=swapShiftsCache.filter(s=>s.shift_assignments?.some(a=>a.staff_id===tid));
  document.getElementById('swapTargetShift').innerHTML=ts.length
    ?ts.map(s=>`<option value="${s.id}">${D[s.day_index]}: ${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)}</option>`).join('')
    :`<option value="">${L().swapNoShifts}</option>`;
}

function closeSwapModal(){document.getElementById('swapModal').classList.remove('open')}

async function sendSwapRequest(){
  if(swapSubmitting)return;
  const myShiftId=document.getElementById('swapMyShift').value;
  const targetId=document.getElementById('swapTargetStaff').value;
  const targetShiftId=document.getElementById('swapTargetShift').value;
  if(!myShiftId||!targetShiftId){showToast('!');return}
  swapSubmitting=true;
  const btn=document.getElementById('swapSendBtn');btn.disabled=true;btn.textContent=L().swapSending;
  const ws=fmtDate(currentWeek);
  const{error}=await sb.from('swap_requests').insert({requester_id:me.id,target_id:targetId,requester_shift_id:myShiftId,target_shift_id:targetShiftId,week_start:ws,status:'pending'});
  if(error){showToast(L().errPrefix+error.message);btn.disabled=false;btn.textContent=L().swapSend;swapSubmitting=false;return}
  const target=allProfiles.find(p=>p.id===targetId);
  const myShift=swapShiftsCache.find(s=>s.id===myShiftId);
  const tShift=swapShiftsCache.find(s=>s.id===targetShiftId);
  const D=L().days;
  await sendEmail({userId:targetId,subject:`Vardiya değişim talebi: ${me.name}`,
    body:`Merhaba ${target?.name},\n\n${me.name} sizinle vardiya değiştirmek istiyor.\n\n${me.name}: ${D[myShift?.day_index]} ${myShift?.start_time?.slice(0,5)}–${myShift?.end_time?.slice(0,5)}\nSizin vardiya: ${D[tShift?.day_index]} ${tShift?.start_time?.slice(0,5)}–${tShift?.end_time?.slice(0,5)}\n\nYanıt için: masalrestaurant.vercel.app/staff.html`});
  closeSwapModal();showToast(L().swapSentOk);loadNotif();updateNotifBadge();
}

// ─── EMAIL ────────────────────────────────────────────────────
async function sendEmail({to,userId,subject,body}){
  try{await fetch(`${SUPABASE_URL}/functions/v1/send-email`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON},body:JSON.stringify({to,userId,subject,body})})}catch(e){}
}

// ─── AYARLAR ─────────────────────────────────────────────────
function loadSettings(){
  // Reflect current saved lang on buttons
  const saved=me.email_lang||'nl';
  renderEmailLangBtns(saved);
  document.getElementById('settingsSaveMsg').textContent='';
}

function renderEmailLangBtns(active){
  ['nl','en','tr'].forEach(l=>{
    const btn=document.getElementById('elBtn'+l.toUpperCase());
    if(!btn)return;
    btn.classList.toggle('active',l===active);
  });
}

async function setEmailLang(l){
  renderEmailLangBtns(l);
  document.getElementById('settingsSaveMsg').textContent='…';
  const{error}=await sb.from('profiles').update({email_lang:l}).eq('id',me.id);
  if(error){
    document.getElementById('settingsSaveMsg').textContent='⚠ '+error.message;
    return;
  }
  me.email_lang=l;
  // Update local allProfiles cache
  const idx=allProfiles.findIndex(p=>p.id===me.id);
  if(idx>=0) allProfiles[idx].email_lang=l;
  document.getElementById('settingsSaveMsg').textContent=L().settingsEmailSaved;
  setTimeout(()=>{document.getElementById('settingsSaveMsg').textContent=''},3000);
}

setLang(lang);
initApp();
