<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masal Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#c6a55c;--gold-dark:#9c7e3e;--dark:#1a1a1a;--bg:#f7f5f0;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:#222;min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-box{background:#fff;padding:2.5rem;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.1);max-width:380px;width:100%;text-align:center}
.login-box .login-logo{height:60px;width:auto;margin-bottom:.3rem;filter:invert(72%) sepia(40%) saturate(400%) hue-rotate(5deg) brightness(95%)}
.login-box p{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem}
.login-box input{width:100%;padding:.85rem 1rem;border:1px solid #ddd;border-radius:8px;font-size:.95rem;margin-bottom:1rem;outline:none}
.login-box input:focus{border-color:var(--gold)}
.login-box button{width:100%;padding:.85rem;background:var(--gold);color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:500;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
.login-box button:hover{background:var(--gold-dark)}
.login-error{color:#c0392b;font-size:.85rem;margin-top:.5rem;min-height:1.2em}

header{background:var(--dark);color:#fff;padding:1.2rem 2rem;display:flex;align-items:center;justify-content:space-between}
header .logo{height:40px;width:auto;filter:brightness(0) invert(1)}
header .user{display:flex;align-items:center;gap:1rem;font-size:.9rem;color:#bbb}
header button{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:.4rem .9rem;border-radius:6px;cursor:pointer;font-size:.8rem;letter-spacing:1px;text-transform:uppercase}
header button:hover{background:var(--gold);color:#fff}
.lang-switch{display:flex;gap:.3rem;border:1px solid rgba(198,165,92,.3);border-radius:6px;padding:.2rem}
.lang-switch button{border:none;background:transparent;color:#bbb;padding:.25rem .55rem;font-size:.75rem;border-radius:4px;cursor:pointer;letter-spacing:.5px}
.lang-switch button.active{background:var(--gold);color:#fff}

.tabs{background:#fff;border-bottom:1px solid #e5e1d8;display:flex;padding:0 2rem}
.tab{padding:1rem 1.4rem;cursor:pointer;color:var(--muted);font-size:.85rem;letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:#222}
.tab.active{color:var(--gold-dark);border-bottom-color:var(--gold)}

main{padding:2rem}
.section{display:none}
.section.active{display:block}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;gap:1rem;flex-wrap:wrap}
.toolbar h2{font-family:Georgia,serif;font-size:1.4rem}
.toolbar .actions{display:flex;gap:.6rem;align-items:center}
.btn{background:var(--gold);color:#fff;border:none;padding:.6rem 1.2rem;border-radius:6px;cursor:pointer;font-size:.85rem;letter-spacing:.5px}
.btn:hover{background:var(--gold-dark)}
.btn.ghost{background:transparent;color:var(--gold-dark);border:1px solid var(--gold)}
.btn.ghost:hover{background:var(--gold);color:#fff}
.btn.danger{background:#c0392b}
.btn.danger:hover{background:#922b21}
.btn.small{padding:.35rem .7rem;font-size:.75rem}

table{width:100%;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.04);border-collapse:collapse}
th{background:#fafafa;text-align:left;padding:.9rem 1rem;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1px solid #eee}
td{padding:.9rem 1rem;font-size:.88rem;border-bottom:1px solid #f3f3f3;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fcfbf7}
.badge{display:inline-block;padding:.2rem .55rem;border-radius:20px;font-size:.7rem;letter-spacing:.5px;text-transform:uppercase}
.badge.new{background:#fff4d6;color:#9c7e3e}
.badge.confirmed{background:#d4edda;color:#155724}
.badge.cancelled{background:#f8d7da;color:#721c24}
.empty{text-align:center;padding:3rem;color:var(--muted);background:#fff;border-radius:10px}

.input,.select{padding:.55rem .8rem;border:1px solid #ddd;border-radius:6px;font-size:.85rem;outline:none;background:#fff}
.input:focus,.select:focus{border-color:var(--gold)}

/* Shifts — Excel table */
.week-label{font-size:.88rem;font-weight:500;color:#444;background:#f7f5f0;padding:.35rem .9rem;border-radius:6px;border:1px solid #e5e1d8;white-space:nowrap}
.sched-wrap{overflow-x:auto;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.04)}
.sched-table{width:100%;border-collapse:collapse;background:#fff;min-width:720px}
.sched-th{background:#fafafa;text-align:center;padding:.6rem .4rem;font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border-bottom:2px solid #eee;border-right:1px solid #eee;white-space:nowrap;min-width:105px}
.sched-th.staff-th{text-align:left;min-width:155px;padding-left:1rem;border-right:2px solid #e0dbd0}
.sched-th.total-th{min-width:64px;border-right:none;border-left:2px solid #e0dbd0;background:#fdf9f4}
.sched-th.wknd{background:#fff9ef}
.sched-tr:hover .sched-td{background:#fcfbf7}
.sched-tr:hover .sched-td.staff-td,.sched-tr:hover .sched-td.total-td{background:#f7f5f0}
.sched-td{padding:0;border-bottom:1px solid #f0ece4;border-right:1px solid #f0ece4;position:relative}
.sched-td.staff-td{padding:.55rem 1rem;background:#fafafa;border-right:2px solid #e0dbd0;white-space:nowrap;font-size:.85rem;font-weight:500;vertical-align:middle}
.sched-td.total-td{text-align:center;background:#fdf9f4;border-left:2px solid #e0dbd0;border-right:none;padding:.4rem .3rem;font-size:.8rem;font-weight:600;color:var(--gold-dark);vertical-align:middle}
.sched-td.wknd{background:#fffcf5}
.sched-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;cursor:pointer;padding:.35rem .25rem;transition:background .12s;text-align:center;gap:2px}
.sched-cell:hover{background:#fdf8f0}
.sv-time{font-size:.82rem;font-weight:600;color:#222;letter-spacing:.2px}
.sv-hrs{font-size:.67rem;color:var(--muted)}
.sched-cell.empty{color:#d0cbc0;font-size:1.3rem;line-height:1}
.sched-cell.empty:hover{color:var(--gold)}
.staff-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.del-staff-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:.8rem;margin-left:.4rem;padding:.1rem .3rem;border-radius:3px;line-height:1;vertical-align:middle}
.del-staff-btn:hover{color:#c0392b;background:#fff0ee}
/* cell edit modal */
.cell-modal{max-width:270px}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal-bg.open{display:flex}
.modal{background:#fff;padding:2rem;border-radius:12px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-family:Georgia,serif;font-size:1.3rem;margin-bottom:1rem}
.modal label{display:block;font-size:.75rem;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:.8rem 0 .3rem}
.modal input,.modal select{width:100%;padding:.6rem .8rem;border:1px solid #ddd;border-radius:6px;font-size:.9rem;outline:none}
.modal-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.5rem}
.staff-list{display:flex;flex-direction:column;gap:.4rem;max-height:240px;overflow-y:auto;border:1px solid #eee;border-radius:6px;padding:.5rem}
.staff-row{display:flex;align-items:center;gap:.6rem;padding:.4rem;border-radius:5px;cursor:pointer}
.staff-row:hover{background:#fafafa}
.staff-row input{width:auto}

/* HACCP table */
.haccp-th{background:#fafafa;padding:.6rem .5rem;font-size:.72rem;letter-spacing:.8px;text-transform:uppercase;color:#888;font-weight:600;border-bottom:2px solid #eee;border-right:1px solid #eee;text-align:center;white-space:nowrap}
.haccp-th.loc-th{text-align:left;min-width:160px;padding-left:1rem;border-right:2px solid #e0dbd0}
.haccp-th.norm-th{min-width:80px;border-right:2px solid #e0dbd0}
.haccp-th.wknd{background:#fff9ef;color:var(--gold-dark)}
.haccp-td{padding:0;border-bottom:1px solid #f0ece4;border-right:1px solid #f0ece4;text-align:center}
.haccp-td.loc-td{padding:.55rem 1rem;background:#fafafa;border-right:2px solid #e0dbd0;text-align:left;font-size:.85rem;font-weight:500;white-space:nowrap}
.haccp-td.norm-td{padding:.4rem .6rem;background:#fafaf7;border-right:2px solid #e0dbd0;font-size:.78rem;color:#888;white-space:nowrap}
.haccp-cell{min-height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:.3rem .2rem;transition:background .1s;font-size:.82rem;font-weight:600;color:#444}
.haccp-cell:hover{background:#fdf8f0}
.haccp-cell.ok{background:#d4edda;color:#155724}
.haccp-cell.nok{background:#f8d7da;color:#721c24}
.haccp-cell.empty{color:#ccc;font-weight:400}

@media(max-width:900px){
  table{font-size:.8rem}
  th,td{padding:.6rem .5rem}
  .sched-wrap{border-radius:6px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <img class="login-logo" src="https://i0.wp.com/masalrestaurant.nl/wp-content/uploads/2021/11/Masal_Logo_DEF.png?fit=600%2C304&ssl=1" alt="Masal">
    <p data-i18n="login_subtitle">Voer uw wachtwoord in om door te gaan</p>
    <form onsubmit="login(event)">
      <input type="password" id="pw" data-i18n-ph="password" placeholder="Wachtwoord" autocomplete="current-password" required>
      <button type="submit" data-i18n="login_btn">Inloggen</button>
      <div class="login-error" id="loginErr"></div>
    </form>
    <div style="margin-top:1rem;display:flex;justify-content:center;gap:.3rem">
      <div class="lang-switch" style="border-color:#ddd">
        <button id="langNL2" class="active" onclick="setLang('nl')" style="color:#888">NL</button>
        <button id="langTR2" onclick="setLang('tr')" style="color:#888">TR</button>
      </div>
    </div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="app" style="display:none">
  <header>
    <img class="logo" src="https://i0.wp.com/masalrestaurant.nl/wp-content/uploads/2021/11/Masal_Logo_DEF.png?fit=600%2C304&ssl=1" alt="Masal">
    <div class="user">
      <div class="lang-switch">
        <button id="langNL" class="active" onclick="setLang('nl')">NL</button>
        <button id="langTR" onclick="setLang('tr')">TR</button>
      </div>
      <span id="userName"></span>
      <button onclick="logout()" data-i18n="logout">Uitloggen</button>
    </div>
  </header>
  <div class="tabs">
    <div class="tab active" data-tab="reservations" data-i18n="tab_reservations" onclick="switchTab('reservations')">Reserveringen</div>
    <div class="tab" data-tab="party" data-i18n="tab_party" onclick="switchTab('party')">Feest aanvragen</div>
    <div class="tab" data-tab="shifts" data-i18n="tab_shifts" onclick="switchTab('shifts')">Shifts</div>
    <div class="tab" data-tab="haccp" onclick="switchTab('haccp')">HACCP</div>
  </div>
  <main>

    <!-- RESERVATIONS -->
    <section class="section active" id="sec-reservations">
      <div class="toolbar">
        <h2 data-i18n="tab_reservations">Reserveringen</h2>
        <div class="actions">
          <select class="select" id="resFilter" onchange="loadReservations()">
            <option value="all" data-i18n="filter_all">Alle</option>
            <option value="new" data-i18n="status_new">Nieuw</option>
            <option value="confirmed" data-i18n="status_confirmed">Bevestigd</option>
            <option value="cancelled" data-i18n="status_cancelled">Geannuleerd</option>
          </select>
          <button class="btn ghost" onclick="loadReservations()" data-i18n="refresh">Vernieuwen</button>
        </div>
      </div>
      <div id="resContainer"></div>
    </section>

    <!-- PARTY REQUESTS -->
    <section class="section" id="sec-party">
      <div class="toolbar">
        <h2 data-i18n="tab_party">Feest aanvragen</h2>
        <div class="actions">
          <button class="btn ghost" onclick="loadParty()" data-i18n="refresh">Vernieuwen</button>
        </div>
      </div>
      <div id="partyContainer"></div>
    </section>

    <!-- SHIFTS -->
    <section class="section" id="sec-shifts">
      <div class="toolbar">
        <h2 data-i18n="tab_shifts">Shifts</h2>
        <div class="actions" style="flex-wrap:wrap;gap:.5rem">
          <button class="btn ghost small" onclick="prevWeek()">←</button>
          <span class="week-label" id="weekLabel">—</span>
          <button class="btn ghost small" onclick="nextWeek()">→</button>
          <input type="date" id="weekPicker" class="input" onchange="onWeekChange()" style="width:138px">
          <button class="btn ghost small" onclick="openAddStaff()" data-i18n="add_staff">+ Medewerker</button>
          <button class="btn ghost small" onclick="loadShifts()" title="Vernieuwen">↻</button>
        </div>
      </div>
      <div class="sched-wrap">
        <table class="sched-table" id="schedTable"></table>
      </div>
    </section>

    <!-- HACCP -->
    <section class="section" id="sec-haccp">
      <div class="toolbar">
        <h2>Registratie temperaturen</h2>
        <div class="actions" style="flex-wrap:wrap;gap:.5rem">
          <button class="btn ghost small" onclick="haccpPrevWeek()">←</button>
          <span class="week-label" id="haccpWeekLabel">—</span>
          <button class="btn ghost small" onclick="haccpNextWeek()">→</button>
          <button class="btn ghost small" onclick="loadHaccp()" title="Vernieuwen">↻</button>
        </div>
      </div>
      <div style="display:flex;gap:1rem;margin-bottom:1rem;align-items:center;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:.4rem">
          <div style="width:12px;height:12px;border-radius:3px;background:#d4edda;border:1px solid #c3e6cb"></div>
          <span style="font-size:.8rem;color:#666">Binnen norm</span>
        </div>
        <div style="display:flex;align-items:center;gap:.4rem">
          <div style="width:12px;height:12px;border-radius:3px;background:#f8d7da;border:1px solid #f5c6cb"></div>
          <span style="font-size:.8rem;color:#666">Afwijking</span>
        </div>
        <span style="font-size:.8rem;color:#999;margin-left:auto">Klik op een cel om te bewerken</span>
      </div>
      <div style="overflow-x:auto;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.04)">
        <table id="haccpTable" style="min-width:700px;background:#fff;border-collapse:collapse;width:100%">
          <thead><tr id="haccpHeader"></tr></thead>
          <tbody id="haccpBody"></tbody>
        </table>
      </div>
      <div style="margin-top:1.5rem;background:#fff;border-radius:10px;padding:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,.04)">
        <h3 style="font-family:Georgia,serif;font-size:1.1rem;margin-bottom:1rem">Opmerkingen / corrigerende maatregelen</h3>
        <textarea id="haccpNotes" rows="3" class="input" style="width:100%;resize:vertical;font-size:.9rem;line-height:1.5" placeholder="Notities..."></textarea>
        <div style="display:flex;align-items:center;gap:.8rem;margin-top:.8rem;flex-wrap:wrap">
          <label style="font-size:.85rem;color:#666;white-space:nowrap">Paraaf:</label>
          <input type="text" id="haccpParaaf" class="input" style="width:120px" placeholder="Initialen...">
          <button class="btn" onclick="saveHaccpNotes()">Opslaan</button>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- CELL EDIT MODAL -->
<div class="modal-bg" id="cellModal">
  <div class="modal cell-modal">
    <h3 id="cellModalTitle" style="font-size:1rem;margin-bottom:1rem"></h3>
    <div class="time-row">
      <div>
        <label data-i18n="start_time">Begintijd</label>
        <input type="time" id="cellStart" class="input" style="width:100%">
      </div>
      <div>
        <label data-i18n="end_time">Eindtijd</label>
        <input type="time" id="cellEnd" class="input" style="width:100%">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger small" id="cellDeleteBtn" onclick="deleteCellShift()" style="margin-right:auto;display:none" data-i18n="delete">Wissen</button>
      <button class="btn ghost" onclick="closeCellModal()" data-i18n="cancel">Annuleren</button>
      <button class="btn" onclick="saveCellShift()" data-i18n="save">Opslaan</button>
    </div>
  </div>
</div>

<!-- ADD STAFF MODAL -->
<div class="modal-bg" id="addStaffModal">
  <div class="modal" style="max-width:320px">
    <h3 data-i18n="add_staff_title">Medewerker toevoegen</h3>
    <label data-i18n="f_name">Naam</label>
    <input type="text" id="newStaffName" class="input" style="width:100%" data-i18n-ph="name_ph" placeholder="Volledige naam">
    <label data-i18n="initials">Initialen</label>
    <input type="text" id="newStaffInitials" class="input" maxlength="3" style="width:100%" data-i18n-ph="initials_ph" placeholder="bijv. AK">
    <label data-i18n="color">Kleur</label><br>
    <input type="color" id="newStaffColor" value="#c6a55c" style="margin-top:.3rem;height:38px;width:60px;border:1px solid #ddd;border-radius:6px;cursor:pointer;padding:2px">
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeAddStaff()" data-i18n="cancel">Annuleren</button>
      <button class="btn" onclick="saveStaff()" data-i18n="save">Opslaan</button>
    </div>
  </div>
</div>

let cellState={};

function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}
function fmtDate(d){return d.toISOString().slice(0,10)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}

function updateWeekLabel(){
  const end=addDays(currentWeek,6);
  const MO=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  const s=currentWeek.getDate()+' '+MO[currentWeek.getMonth()];
  const e=end.getDate()+' '+MO[end.getMonth()]+' '+end.getFullYear();
  document.getElementById('weekLabel').textContent=s+' – '+e;
  document.getElementById('weekPicker').value=fmtDate(currentWeek);
}
function onWeekChange(){const v=document.getElementById('weekPicker').value;if(!v)return;currentWeek=mondayOf(new Date(v+'T12:00:00'));updateWeekLabel();loadShifts()}
function prevWeek(){currentWeek=addDays(currentWeek,-7);updateWeekLabel();loadShifts()}
function nextWeek(){currentWeek=addDays(currentWeek,7);updateWeekLabel();loadShifts()}

function hrsNum(s,e){const[sh,sm]=s.split(':').map(Number);const[eh,em]=e.split(':').map(Number);return((eh*60+em)-(sh*60+sm))/60}
function hrsLabel(n){const u=t('hour_unit');return n<=0?'':n%1===0?n+' '+u:n.toFixed(1)+' '+u}

async function loadShifts(){
  if(!currentWeek)currentWeek=mondayOf(new Date());
  updateWeekLabel();
  const ws=fmtDate(currentWeek);
  const{data:shifts=[]}=await sb.from('shifts').select('*').eq('week_start',ws);
  const ids=(shifts||[]).map(s=>s.id);
  let assigns=[];
  if(ids.length){const{data}=await sb.from('shift_assignments').select('*').in('shift_id',ids);assigns=data||[];}

  // matrix[staffId][dayIndex] = {shiftId, assignId, start, end}
  const matrix={};
  profiles.forEach(p=>{matrix[p.id]={}});
  shifts.forEach(s=>{
    assigns.filter(a=>a.shift_id===s.id).forEach(a=>{
      if(matrix[a.staff_id]&&!matrix[a.staff_id][s.day_index])
        matrix[a.staff_id][s.day_index]={shiftId:s.id,start:s.start_time,end:s.end_time};
    });
  });

  const DN=currentLang==='tr'?['Pt','Sa','Ça','Pe','Cu','Ct','Pz']:['Ma','Di','Wo','Do','Vr','Za','Zo'];
  const MO=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];

  // Header
  const thDays=DN.map((d,i)=>{
    const dt=addDays(currentWeek,i);
    const isWknd=i>=5;
    return`<th class="sched-th${isWknd?' wknd':''}">${d}<br><small style="font-weight:400;font-size:.68rem">${dt.getDate()} ${MO[dt.getMonth()]}</small></th>`;
  }).join('');

  // Rows
  const staff=profiles.filter(p=>p.role!=='admin'||profiles.length===1);
  const rows=staff.length?staff.map(p=>{
    let weekTotal=0;
    const cells=DN.map((_,i)=>{
      const cell=matrix[p.id]?.[i];
      const isWknd=i>=5;
      if(cell){
        const h=hrsNum(cell.start,cell.end);weekTotal+=h;
        const data=`'${p.id}',${i},'${cell.shiftId}','${cell.start}','${cell.end}'`;
        return`<td class="sched-td${isWknd?' wknd':''}"><div class="sched-cell filled" onclick="openCellModal(${data})"><span class="sv-time">${cell.start.slice(0,5)}–${cell.end.slice(0,5)}</span><span class="sv-hrs">${hrsLabel(h)}</span></div></td>`;
      }else{
        const data=`'${p.id}',${i},null,null,'09:00','17:00'`;
        return`<td class="sched-td${isWknd?' wknd':''}"><div class="sched-cell empty" onclick="openCellModal(${data})">+</div></td>`;
      }
    }).join('');
    return`<tr class="sched-tr">
      <td class="sched-td staff-td">
        <span class="staff-dot" style="background:${p.color||'#aaa'}"></span>&nbsp;${esc(p.name||'?')}
        <button class="del-staff-btn" onclick="deleteStaff('${p.id}',event)" title="${t('confirm_delete_staff')}">✕</button>
      </td>
      ${cells}
      <td class="sched-td total-td">${weekTotal>0?hrsLabel(weekTotal):'–'}</td>
    </tr>`;
  }).join(''):`<tr><td colspan="9" class="empty" style="padding:2rem">${t('no_staff')}</td></tr>`;

  document.getElementById('schedTable').innerHTML=`
    <thead><tr>
      <th class="sched-th staff-th">${t('col_staff')}</th>
      ${thDays}
      <th class="sched-th total-th">${t('col_total')}</th>
    </tr></thead>
    <tbody>${rows}</tbody>`;
}

// === HACCP TEMPERATURE REGISTRATION ===
const HACCP_LOCS=[
  {key:'koelvriesruimte',label:'Koelvriesruimte',norm:'Max. 7°C',type:'temp',maxVal:7},
  {key:'koelcel_1',label:'Koelcel',norm:'Max. 7°C',type:'temp',maxVal:7},
  {key:'koelcel_2',label:'Koelcel',norm:'< -18°C',type:'temp_min',maxVal:-18},
  {key:'vriezer_1',label:'Vriezer',norm:'< -18°C',type:'temp_min',maxVal:-18},
  {key:'vriezer_2',label:'Vriezer',norm:'< -18°C',type:'temp_min',maxVal:-18},
  {key:'vriezer_ijs',label:'Vriezer ijs',norm:'Max. 7°C',type:'temp',maxVal:7},
  {key:'koelwerkbank_1',label:'Koelwerkbank',norm:'Max. 7°C',type:'temp',maxVal:7},
  {key:'koelwerkbank_2',label:'Koelwerkbank',norm:'Max. 7°C',type:'temp',maxVal:7},
  {key:'koelwerkbank_3',label:'Koelwerkbank',norm:'Max. 7°C',type:'temp',maxVal:7},
  {key:'saladiere_1',label:'Saladiere',norm:'Zie instr.',type:'text'},
  {key:'saladiere_2',label:'Saladiere',norm:'Zie instr.',type:'text'},
  {key:'tht_fifo',label:'THT, FiFo, juiste scheiding',norm:'Zie schema',type:'check'},
  {key:'afgedekt',label:'Afgedekt, codering',norm:'> 60°C',type:'temp_hot',minVal:60},
  {key:'reiniging',label:'Juiste reiniging en desinfectie',norm:'> 80°C',type:'temp_hot',minVal:80},
  {key:'vaatwasser',label:'Vaatwasser wastemperatuur (display)',norm:'Zie instr.',type:'text'},
  {key:'naspoeltemp',label:'Naspoeltemperatuur (display)',norm:'—',type:'text'},
  {key:'softijs',label:'Softijsmachine pasteurisatie',norm:'Ja/Nee',type:'check'},
];
const HACCP_DAYS=['mon','tue','wed','thu','fri','sat','sun'];
const HACCP_DAY_NL=['Ma','Di','Wo','Do','Vr','Za','Zo'];
let haccpCurrentWeek=null;
let haccpData={};
let haccpNotesData={notes:'',paraaf:''};

function getISOWeekNum(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const dayNum=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-dayNum);
  const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return{week:Math.ceil((((d-yearStart)/86400000)+1)/7),year:d.getUTCFullYear()};
}
function isTempCellOk(loc,value){
  if(value===''||value===null||value===undefined)return null;
  if(loc.type==='check')return value==='ja';
  if(loc.type==='text')return null;
  const num=parseFloat(value);
  if(isNaN(num))return null;
  if((loc.type==='temp'||loc.type==='temp_min')&&loc.maxVal!==undefined)return num<=loc.maxVal;
  if(loc.type==='temp_hot'&&loc.minVal!==undefined)return num>=loc.minVal;
  return null;
}
function haccpPrevWeek(){haccpCurrentWeek=addDays(haccpCurrentWeek,-7);loadHaccp()}
function haccpNextWeek(){haccpCurrentWeek=addDays(haccpCurrentWeek,7);loadHaccp()}
function updateHaccpWeekLabel(){
  const{week,year}=getISOWeekNum(haccpCurrentWeek);
  const end=addDays(haccpCurrentWeek,6);
  const MO=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  const s=haccpCurrentWeek.getDate()+' '+MO[haccpCurrentWeek.getMonth()];
  const e=end.getDate()+' '+MO[end.getMonth()]+' '+end.getFullYear();
  document.getElementById('haccpWeekLabel').textContent=`Week ${week} · ${s} – ${e}`;
}
async function loadHaccp(){
  if(!haccpCurrentWeek)haccpCurrentWeek=mondayOf(new Date());
  updateHaccpWeekLabel();
  const{week,year}=getISOWeekNum(haccpCurrentWeek);
  const[regRes,notesRes]=await Promise.all([
    sb.from('temp_registrations').select('*').eq('week_number',week).eq('year',year),
    sb.from('temp_week_notes').select('*').eq('week_number',week).eq('year',year).maybeSingle(),
  ]);
  haccpData={};
  (regRes.data||[]).forEach(row=>{
    haccpData[row.location_key]={mon:row.mon,tue:row.tue,wed:row.wed,thu:row.thu,fri:row.fri,sat:row.sat,sun:row.sun};
  });
  haccpNotesData=notesRes.data||{notes:'',paraaf:''};
  renderHaccpTable();
}
function renderHaccpTable(){
  const header=document.getElementById('haccpHeader');
  const body=document.getElementById('haccpBody');
  if(!header||!body)return;
  const MO=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  header.innerHTML=
    `<th class="haccp-th loc-th">Locatie</th>`+
    `<th class="haccp-th norm-th">Norm</th>`+
    HACCP_DAY_NL.map((d,i)=>{
      const dt=addDays(haccpCurrentWeek,i);
      return`<th class="haccp-th${i>=5?' wknd':''}">${d}<br><small style="font-weight:400;font-size:.65rem">${dt.getDate()} ${MO[dt.getMonth()]}</small></th>`;
    }).join('');
  body.innerHTML=HACCP_LOCS.map(loc=>{
    const cells=HACCP_DAYS.map((day,di)=>{
      const val=haccpData[loc.key]?.[day];
      const hasVal=val!==null&&val!==undefined&&val!=='';
      const ok=isTempCellOk(loc,val);
      const isWknd=di>=5;
      let cls='haccp-cell';
      let display='—';
      if(hasVal){
        display=loc.type==='check'?(val==='ja'?'✓':'✗'):val;
        if(ok===true)cls+=' ok';
        else if(ok===false)cls+=' nok';
      }else{cls+=' empty'}
      const wkndStyle=isWknd&&!hasVal?'background:#fffcf5;':'';
      return`<td class="haccp-td" style="${wkndStyle}"><div class="${cls}" onclick="haccpEditCell('${loc.key}','${day}')">${esc(String(display))}</div></td>`;
    }).join('');
    return`<tr><td class="haccp-td loc-td">${esc(loc.label)}</td><td class="haccp-td norm-td">${esc(loc.norm)}</td>${cells}</tr>`;
  }).join('');
  document.getElementById('haccpNotes').value=haccpNotesData.notes||'';
  document.getElementById('haccpParaaf').value=haccpNotesData.paraaf||'';
}
function haccpEditCell(locKey,day){
  const loc=HACCP_LOCS.find(l=>l.key===locKey);
  if(!loc)return;
  const existing=haccpData[locKey]?.[day];
  let newVal;
  if(loc.type==='check'){
    if(existing==='ja')newVal='nee';
    else if(existing==='nee')newVal='';
    else newVal='ja';
  }else{
    const input=prompt(`${loc.label} — ${HACCP_DAY_NL[HACCP_DAYS.indexOf(day)]}\nNorm: ${loc.norm}\n\nHuidige waarde: ${existing||'(leeg)'}\nNieuwe waarde (leeg = wissen):`,existing||'');
    if(input===null)return;
    newVal=input.trim();
  }
  saveTempCell(locKey,day,newVal||null);
}
async function saveTempCell(locKey,day,value){
  const{week,year}=getISOWeekNum(haccpCurrentWeek);
  const existing=haccpData[locKey]||{};
  const newRow={...existing,[day]:value};
  const{error}=await sb.from('temp_registrations')
    .upsert({week_number:week,year,location_key:locKey,...newRow},{onConflict:'week_number,year,location_key'});
  if(!error){haccpData[locKey]=newRow;renderHaccpTable();}
  else alert('Fout: '+error.message);
}
async function saveHaccpNotes(){
  const{week,year}=getISOWeekNum(haccpCurrentWeek);
  const notes=document.getElementById('haccpNotes').value;
  const paraaf=document.getElementById('haccpParaaf').value;
  const{error}=await sb.from('temp_week_notes')
    .upsert({week_number:week,year,notes:notes||null,paraaf:paraaf||null},{onConflict:'week_number,year'});
  if(error)alert('Fout: '+error.message);
  else haccpNotesData={notes,paraaf};
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
