<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masal — Geri Bildirim</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Jost:wght@300;400;500;600&display=swap');
:root{--gold:#c6a55c;--gold-light:#d4b87a;--bg:#111;--card:#1e1e1e;--border:rgba(198,165,92,.2);--muted:rgba(255,255,255,.55)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#fff;font-family:'Jost',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
.logo{height:52px;margin:1rem 0 2rem;filter:brightness(0) invert(1)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;max-width:480px;width:100%}
.lang-bar{display:flex;justify-content:flex-end;gap:.3rem;margin-bottom:1rem}
.lang-bar button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:.3rem .6rem;border-radius:5px;cursor:pointer;font-size:.7rem;letter-spacing:1px;font-family:inherit}
.lang-bar button.active{background:var(--gold);border-color:var(--gold);color:#111;font-weight:600}
h2{font-family:'Playfair Display',serif;color:var(--gold);font-size:1.6rem;margin-bottom:.4rem;text-align:center}
.sub{color:var(--muted);font-size:.88rem;text-align:center;margin-bottom:1.6rem;line-height:1.5}
label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin:1.1rem 0 .5rem}
input[type=text],input[type=email],textarea{width:100%;background:#2a2a2a;border:1.5px solid rgba(198,165,92,.18);color:#fff;border-radius:8px;padding:.7rem .9rem;font-size:.95rem;font-family:inherit;outline:none;transition:border-color .2s}
input[type=text]:focus,input[type=email]:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
.stars{display:flex;gap:.4rem}
.star{width:34px;height:34px;cursor:pointer;color:#555;transition:color .2s,transform .15s}
.star:hover,.star.active{color:var(--gold);transform:scale(1.1)}
.cats{display:flex;flex-wrap:wrap;gap:.55rem}
.cat-chip{padding:.5rem 1rem;border:1.5px solid var(--border);border-radius:24px;cursor:pointer;font-size:.82rem;color:var(--muted);transition:all .2s;user-select:none}
.cat-chip:hover{border-color:var(--gold);color:var(--gold-light)}
.cat-chip.selected{background:var(--gold);border-color:var(--gold);color:#111;font-weight:500}
.submit{width:100%;background:var(--gold);color:#111;border:none;padding:.95rem;border-radius:9px;font-family:inherit;font-size:.86rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:1.6rem;transition:background .25s}
.submit:hover:not(:disabled){background:var(--gold-light)}
.submit:disabled{opacity:.55;cursor:not-allowed}
.err{color:#e74c3c;font-size:.85rem;margin-top:.8rem;min-height:1.1em;text-align:center}
.success-icon{font-size:3rem;text-align:center;margin-bottom:.8rem}
.back-link{display:block;text-align:center;margin-top:1.5rem;color:var(--gold);text-decoration:none;font-size:.85rem;letter-spacing:1px}
.back-link:hover{color:var(--gold-light)}
.privacy{font-size:.72rem;color:var(--muted);text-align:center;margin-top:1rem;line-height:1.5}
</style>
</head>
<body>
<img class="logo" src="https://i0.wp.com/masalrestaurant.nl/wp-content/uploads/2021/11/Masal_Logo_DEF.png?fit=600%2C304&ssl=1" alt="Masal">
<div class="card">
  <div class="lang-bar">
    <button onclick="setLang('nl')" id="lbNL">NL</button>
    <button onclick="setLang('en')" id="lbEN">EN</button>
    <button onclick="setLang('tr')" id="lbTR">TR</button>
  </div>
  <div id="formBox">
    <h2 id="title">—</h2>
    <p class="sub" id="subtitle">—</p>

    <label id="lblRating">—</label>
    <div class="stars" id="stars"></div>

    <label id="lblCats">—</label>
    <div class="cats" id="cats"></div>

    <label id="lblName">—</label>
    <input type="text" id="fbName">

    <label id="lblEmail">—</label>
    <input type="email" id="fbEmail">

    <label id="lblMsg">—</label>
    <textarea id="fbMessage"></textarea>

    <button class="submit" id="submitBtn" onclick="submitFb()">—</button>
    <div class="err" id="err"></div>
    <p class="privacy" id="privacy">—</p>
  </div>
  <div id="successBox" style="display:none;text-align:center">
    <div class="success-icon">✓</div>
    <h2 id="okTitle">—</h2>
    <p class="sub" id="okMsg">—</p>
    <a href="index.html" class="back-link" id="okBack">—</a>
  </div>
</div>

<script>
const SUPABASE_URL='https://mytqxxdzfrropqcrhipv.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15dHF4eGR6ZnJyb3BxY3JoaXB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MjgwMTUsImV4cCI6MjA5MTAwNDAxNX0.eKAts80PGm6TTYSllnYq79UaG0_ERJi7FBLnh2GgG4I';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

const T={
  nl:{
    title:'Geef ons uw feedback',
    sub:'Wij waarderen uw eerlijke mening. Vertel ons wat er beter kan.',
    rating:'Hoe was het in het algemeen?',
    cats:'Waar zat het probleem?',
    cat_food:'Eten',cat_service:'Service',cat_atmos:'Sfeer',cat_price:'Prijs',cat_wait:'Wachten',cat_other:'Anders',
    name:'Naam (optioneel)',
    email:'E-mail (optioneel)',
    msg:'Bericht',
    submit:'Versturen',
    err_msg:'Schrijf alstublieft een korte boodschap.',
    err_send:'Er ging iets mis. Probeer het opnieuw.',
    ok_title:'Bedankt!',
    ok_msg:'Wij waarderen uw feedback enorm en gebruiken het om beter te worden.',
    ok_back:'Terug naar de website',
    privacy:'Uw feedback wordt veilig opgeslagen en alleen door het Masal-team bekeken.'
  },
  en:{
    title:'Share your feedback',
    sub:'We value your honest opinion. Tell us what we can improve.',
    rating:'How was it overall?',
    cats:'Where was the issue?',
    cat_food:'Food',cat_service:'Service',cat_atmos:'Atmosphere',cat_price:'Price',cat_wait:'Waiting time',cat_other:'Other',
    name:'Name (optional)',
    email:'Email (optional)',
    msg:'Message',
    submit:'Send',
    err_msg:'Please write a short message.',
    err_send:'Something went wrong. Please try again.',
    ok_title:'Thank you!',
    ok_msg:'We really appreciate your feedback and use it to improve.',
    ok_back:'Back to website',
    privacy:'Your feedback is stored securely and only seen by the Masal team.'
  },
  tr:{
    title:'Geri bildiriminizi paylaşın',
    sub:'Dürüst görüşünüze çok değer veriyoruz. Nelerin daha iyi olabileceğini söyleyin.',
    rating:'Genel olarak nasıldı?',
    cats:'Sorun neredeydi?',
    cat_food:'Yemek',cat_service:'Servis',cat_atmos:'Atmosfer',cat_price:'Fiyat',cat_wait:'Bekleme',cat_other:'Diğer',
    name:'Ad (isteğe bağlı)',
    email:'E-posta (isteğe bağlı)',
    msg:'Mesajınız',
    submit:'Gönder',
    err_msg:'Lütfen kısa bir mesaj yazın.',
    err_send:'Bir şeyler ters gitti. Lütfen tekrar deneyin.',
    ok_title:'Teşekkür ederiz!',
    ok_msg:'Geri bildiriminize çok değer veriyoruz, gelişmek için kullanıyoruz.',
    ok_back:'Siteye dön',
    privacy:'Geri bildiriminiz güvenle saklanır, yalnızca Masal ekibi görür.'
  }
};

const CATS=['cat_food','cat_service','cat_atmos','cat_price','cat_wait','cat_other'];
const URL_PARAMS=new URLSearchParams(location.search);
const RES_ID=URL_PARAMS.get('id')||null;
let lang=URL_PARAMS.get('lang')||localStorage.getItem('masalLang')||'nl';
let rating=0;
let selectedCats=new Set();

function setLang(l){
  lang=l;
  localStorage.setItem('masalLang',l);
  document.documentElement.lang=l;
  document.querySelectorAll('.lang-bar button').forEach(b=>b.classList.toggle('active',b.id==='lb'+l.toUpperCase()));
  applyLang();
}

function applyLang(){
  const t=T[lang]||T.nl;
  document.getElementById('title').textContent=t.title;
  document.getElementById('subtitle').textContent=t.sub;
  document.getElementById('lblRating').textContent=t.rating;
  document.getElementById('lblCats').textContent=t.cats;
  document.getElementById('lblName').textContent=t.name;
  document.getElementById('lblEmail').textContent=t.email;
  document.getElementById('lblMsg').textContent=t.msg;
  document.getElementById('submitBtn').textContent=t.submit;
  document.getElementById('privacy').textContent=t.privacy;
  document.getElementById('okTitle').textContent=t.ok_title;
  document.getElementById('okMsg').textContent=t.ok_msg;
  document.getElementById('okBack').textContent=t.ok_back;
  // categories
  document.getElementById('cats').innerHTML=CATS.map(k=>`<div class="cat-chip${selectedCats.has(k)?' selected':''}" data-cat="${k}" onclick="toggleCat('${k}',this)">${t[k]}</div>`).join('');
}

function buildStars(){
  document.getElementById('stars').innerHTML=[1,2,3,4,5].map(i=>
    `<svg class="star${i<=rating?' active':''}" data-r="${i}" onclick="setRating(${i})" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`
  ).join('');
}
function setRating(r){rating=r;buildStars()}

function toggleCat(k,el){
  if(selectedCats.has(k)){selectedCats.delete(k);el.classList.remove('selected')}
  else{selectedCats.add(k);el.classList.add('selected')}
}

async function submitFb(){
  const t=T[lang]||T.nl;
  const msg=document.getElementById('fbMessage').value.trim();
  const errEl=document.getElementById('err');
  errEl.textContent='';
  if(!msg){errEl.textContent=t.err_msg;return}
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;
  const{error}=await sb.rpc('submit_feedback',{
    p_reservation_id:RES_ID,
    p_name:document.getElementById('fbName').value.trim()||null,
    p_email:document.getElementById('fbEmail').value.trim()||null,
    p_rating:rating||null,
    p_categories:[...selectedCats],
    p_message:msg,
    p_lang:lang
  });
  if(error){errEl.textContent=t.err_send;btn.disabled=false;return}
  // success
  document.getElementById('formBox').style.display='none';
  document.getElementById('successBox').style.display='block';
}

// init
setLang(lang);
buildStars();
</script>
</body>
</html>
